name: Build Face Voice Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - worldlink-development

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Allow Gradle wrapper to run
        run: chmod +x gradlew

      - name: Restore persistent Android debug keystore
        env:
          WORLDLINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.WORLDLINK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$KEYSTORE_DIR"
          printf '%s' "$WORLDLINK_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DIR/debug.keystore"
          chmod 600 "$KEYSTORE_DIR/debug.keystore"
          keytool -list -keystore "$KEYSTORE_DIR/debug.keystore" -alias AndroidDebugKey -storepass android >/dev/null

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Show debug signing fingerprints
        run: ./gradlew --no-daemon signingReport

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Face-Voice-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
